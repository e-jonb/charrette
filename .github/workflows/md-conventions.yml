name: Markdown conventions

# Calls scripts/md-conventions.py rather than reimplementing its rules. An
# earlier version inlined the detection logic here and carried a note saying
# "if the rules change, update both" - two implementations of one rule, free
# to disagree, in the layer whose entire job is catching what the local hook
# missed. The checker is committed in this repo, so CI can just run it.
#
# Diff-scoped on purpose. A repo can carry many pre-existing em dashes, so a
# whole-repo check would fail on day one and get switched off. This only
# looks at lines ADDED by the push or PR.
#
# Exit codes from the checker: 0 clean, 1 hard breaks (fails the job), 2 em
# dashes only (reported, does not fail - an em dash may be quoted source
# material, which is a human call).
#
# The GitLab equivalent is in templates/ci/. Exactly one CI file should be
# live in a given repo: one that cannot run still looks like coverage.

on:
  push:
    paths: ['**.md']
  pull_request:
    paths: ['**.md']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Verify the base commit actually exists rather than comparing against
          # the all-zeros sentinel. Also covers force-pushes and shallow clones,
          # where the sentinel check alone would still hand git a dead ref.
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check markdown conventions
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -uo pipefail

          if [ -z "$BASE" ]; then
            echo "No base commit (initial push); skipping."
            exit 0
          fi

          # Say what was examined. Without this line a misconfigured job and a
          # genuinely clean one are both just a green check, and a check whose
          # zero is invisible is a check nobody notices has stopped working.
          files=$(git diff --name-only --diff-filter=ACM "$BASE" HEAD -- '*.md')
          count=$(printf '%s' "$files" | grep -c . || true)
          echo "Examined $count changed markdown file(s) against $BASE."

          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          printf '  %s\n' $files

          python3 scripts/md-conventions.py --added-lines "$BASE" $files
          status=$?

          case "$status" in
            0) echo "Clean." ;;
            2) echo "Em dash findings on added lines - house style is en dash (–), unless quoting source. Not failing the build." ;;
            *) echo "Hard-break violations on added lines. Append ' \\' to all but the last line of each metadata run." >&2
               exit 1 ;;
          esac
